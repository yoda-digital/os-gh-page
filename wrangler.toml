# Cloudflare Pages config for opensource.yoda.digital
#
# Bindings (KV namespace WEBHOOK_KV, R2 bucket BUILD_CACHE) are managed
# from the CF dashboard:
#   Pages → opensource-portal → Settings → Functions → Bindings
#
# Reason: wrangler.toml requires concrete namespace/bucket IDs at deploy
# time. Before those resources exist in your account, the dashboard route
# is the cleaner path. Once IDs exist, you can move them back into this
# file (uncomment the blocks below and fill in the IDs).
#
# Required env vars (also set via Pages → Settings → Environment variables):
#   GITHUB_TOKEN            — fine-grained PAT for the prebuild scripts
#   GITHUB_WEBHOOK_SECRET   — shared secret with the GitHub App
#   CF_PAGES_DEPLOY_HOOK    — Pages deploy hook URL (production branch)
#   PUBLIC_SITE_URL         — https://opensource.yoda.digital
#   NODE_VERSION            — 24

name = "yoda-opensource"
compatibility_date = "2026-04-01"
pages_build_output_dir = "dist"

# [[kv_namespaces]]
# binding = "WEBHOOK_KV"
# id = "<your KV namespace id>"
# preview_id = "<your KV preview namespace id>"

# [[r2_buckets]]
# binding = "BUILD_CACHE"
# bucket_name = "yoda-os-build-cache"
# preview_bucket_name = "yoda-os-build-cache-preview"
